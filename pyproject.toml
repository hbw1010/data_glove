[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glove-v21-calibrate"
version = "0.1.0"
description = "独立V21左右手标定与离线三阶段数据处理"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
glove-calibrate = "glove_calibrate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
