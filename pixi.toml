[workspace]
name = "glove-v21-calibrate"
version = "0.1.0"
description = "独立V21左右手实时采集、Web标定、离线重定向与同步回放"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26,<3"
scipy = ">=1.11,<2"
mujoco = ">=3.6,<4"
pinocchio = ">=3.8,<4"
nlopt = ">=2.7,<3"
pyyaml = ">=6,<7"
h5py = ">=3.11,<4"
fastapi = ">=0.115,<1"
uvicorn = ">=0.30,<1"
nodejs = ">=22,<23"
pytest = ">=8,<10"
httpx = ">=0.27,<1"
setuptools = ">=75"
libusb = ">=1.0.27,<2"

[pypi-dependencies]
glove-v21-calibrate = { path = ".", editable = true }
adbutils = ">=2.9,<3"

[activation.env]
PYTHONPYCACHEPREFIX = "$PIXI_PROJECT_ROOT/.cache/pycache"
PYTHONNOUSERSITE = "1"
npm_config_cache = "$PIXI_PROJECT_ROOT/.cache/npm"
PYTHONPATH = "$PIXI_PROJECT_ROOT/vendor/wuji-retargeting"

[tasks]
web-install = "npm --prefix web ci"
web-build = { cmd = "npm --prefix web run build", depends-on = ["web-install"] }
start = { cmd = "python -m glove_calibrate serve", depends-on = ["web-build"] }
serve = "python -m glove_calibrate serve"
process = "python -m glove_calibrate process"
inspect = "python -m glove_calibrate inspect"
test = "python -m pytest tests -q --basetemp=.cache/pytest-tmp"
