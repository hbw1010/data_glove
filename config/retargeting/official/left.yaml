# 离线官方 Hand2 IK 参数；无设备配置，来源见 provenance.json。
optimizer:
  type: "AdaptiveOptimizerAnalytical"
  # --- Wuji Hand 2 at hand2/body/ in the wuji-description
  # submodule (v2026.6.11+). Both IK and sim use the official assets shipped there:
  #   IK  : urdf_path  -> official hand2/body/urdf (Pinocchio + collision STL hulls)
  #   sim : mjcf_path  -> official hand2/body/mjcf (MuJoCo; meshes under hand2/body/meshes)
  urdf_path: "../../../assets/wuji-hand2/body/urdf/left.urdf"
  self_collision:
    enabled: false       # 离线导出优先速度，不施加自碰撞约束；结果可能穿模。
    margin_m: 0.0005       # 0.5 mm clearance between non-assembly convex hulls
    tolerance_m: 0.0000001 # 0.1 um numerical feasibility tolerance
    pair_margins:
      - links: [l_wrist, l_thumb_proximal_abd]
        margin_m: 0.00005 # 0.05 mm; collision remains forbidden for this assembly.
        reason: "Nested two-axis thumb assembly: exact CAD clearance reaches only about 0.116 mm within URDF limits; 0.5 mm is infeasible."
  # Wuji Hand 2 uses anatomical link names (l_wrist / l_index_finger_pip ...).
  # link_naming maps the optimizer's logical roles onto them so the retargeting
  # code stays URDF-agnostic. fingers are ordered thumb..pinky.
  link_naming:
    prefix: "l_"
    palm:    "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip:     "{finger}_middle"        # PIP
    dip:     "{finger}_distal"        # DIP
    tip:     "{finger}_tip"           # fingertip
    link1:   "{finger}_proximal_abd"  # MCP abduction link (finger-plane ref)

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  w_full_hand: 1.0
  thumb_skip_pip: true   # wuji_glove SDK reconstructs thumb MCP (kp[2]) inaccurately; drop it from FullHandVec loss
  # Style penalty: discourage hyperextension and uncoupled PIP/DIP curl
  w_hyper: 1.0           # PIP/DIP joints below soft_min are penalized quadratically
  soft_min: 0.0          # joint angle threshold (rad); 0 = no negative angles allowed
  w_couple: 0.1          # DIP pulled toward couple_ratio * PIP per finger
  couple_ratio: 0.7      # biomechanical (DIP curls ~70% of PIP)
  lp_alpha: 0.2

  # Per-segment scaling of the retargeted finger lengths (per finger: proximal,
  # middle, distal). Tune per hand if the fingertips over- or under-reach the
  # target keypoints.
  # segment_scaling:
  #   thumb:  [0.9, 0.9, 0.9]
  #   index:  [0.95, 0.95, 0.95]
  #   middle: [0.9, 0.9, 0.9]
  #   ring:   [0.9, 0.9, 0.9]
  #   pinky:  [1.0, 1.0, 1.0]

  segment_scaling:
    thumb:  [1.0, 1.0, 1.0]
    index:  [1.0, 1.1, 1.1]
    middle: [1.0, 1.0, 0.98]
    ring:   [1.1, 1.0, 1.1]
    pinky:  [1.1, 1.05, 1.1]

  pinch_thresholds:
    index:  { d1: 3.5, d2: 4.0 }
    middle: { d1: 3.5, d2: 4.0 }
    ring:   { d1: 3.5, d2: 4.0 }
    pinky:  { d1: 3.5, d2: 4.0 }
  # The left hand's root frame and calibration may differ from the right (often a
  # mirrored z); tune mediapipe_rotation and the offsets live in tuning_tool.
  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: -90.0

  wrist_offset_cm: [0.0, 0.0, 0.0]   # disabled: SDK uses per-SN calibrated URDF, no extra bias needed
  thumb_offset_cm: [0.0, 0.0, 0.0]   # disabled: same reason

